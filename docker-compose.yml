services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    environment:
      - POSTGRES_DB=healthbridge
      - POSTGRES_USER=healthbridge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbridge -d healthbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    ports:
    - "8001:8001"
    extra_hosts:
      - "clumiddle.aodv.local:10.30.208.208"
      - "bof.asst-brianza.it:10.30.208.208"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gpt-4-turbo}
      - HOST=0.0.0.0
      - PORT=8001
      - CORS_ORIGINS=*
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - REGISTRY_API_URL=${REGISTRY_API_URL:-https://clumiddle.aodv.local/AC/pac/rest/paziente}
      - REGISTRY_API_ENABLED=${REGISTRY_API_ENABLED:-true}
      - REGISTRY_API_TIMEOUT=${REGISTRY_API_TIMEOUT:-30}
      - AURORA_DATA_PATH=${AURORA_DATA_PATH:-data/real-patient.json}
      - PATIENT_DATA_SCHEMA=${PATIENT_DATA_SCHEMA:-chronic_care}
      - CHRONIC_CARE_DATA_PATH=${CHRONIC_CARE_DATA_PATH:-data/chronic-care-patients.json}
      - BOF_API_ENABLED=${BOF_API_ENABLED:-true}
      - BOF_API_URL=${BOF_API_URL:-https://bof.asst-brianza.it/api/v1/index.php}
      - BOF_API_TOKEN=${BOF_API_TOKEN}
      - BOF_API_TIMEOUT=${BOF_API_TIMEOUT:-10}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-Amministratore Sistema}
      - ANONYMIZED_TELEMETRY=false
      - POSTHOG_DISABLED=true
      - LANGCHAIN_TRACING_V2=false
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data:ro
      - chroma-data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./healthcare-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
        - VITE_APP_NAME=${VITE_APP_NAME:-Healthbridge Care}
        - VITE_APP_SUBTITLE=${VITE_APP_SUBTITLE:-Assistente Cure Domiciliari}
        - VITE_INACTIVITY_TIMEOUT_MINUTES=${VITE_INACTIVITY_TIMEOUT_MINUTES:-15}
    container_name: healthcare-frontend
    ports:
    - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma-data:
  postgres-data:
